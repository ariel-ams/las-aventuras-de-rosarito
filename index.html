<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <title>Rosarito y sus pizarras magicas</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Prototipo de juego Rosarito">
      <div id="game"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
      <script>
      if (!window.Phaser) {
        const fallback = document.createElement("script");
        fallback.src = "assets/phaser.min.js";
        fallback.async = false;
        fallback.defer = false;
        fallback.onload = () => {
          if (!window.Phaser) {
            console.error("Fallback de Phaser no se pudo inicializar desde assets/phaser.min.js");
          }
        };
        fallback.onerror = () => {
          console.error("No se pudo cargar Phaser desde CDN ni desde assets/phaser.min.js (necesario agregar copia local para CI/CDP offline)");
        };
        document.head.appendChild(fallback);
      }
    </script>
    <script src="./src/layouts.js"></script>
    <script src="./src/audio.js"></script>
    <script src="./src/data.js"></script>
    <script src="./src/ui.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
